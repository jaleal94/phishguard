{% if pagina.has_other_pages %}
<nav class="mt-3" aria-label="Paginación">
  <ul class="pagination justify-content-center flex-wrap">
    {% if pagina.has_previous %}
    <li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'pagina' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}pagina={{ pagina.previous_page_number }}">Anterior</a></li>
    {% endif %}
    <li class="page-item active" aria-current="page"><span class="page-link">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span></li>
    {% if pagina.has_next %}
    <li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'pagina' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}pagina={{ pagina.next_page_number }}">Siguiente</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
