{% extends "base.html" %}
{% block navegacion %}
{% with nombre=request.resolver_match.url_name %}
<nav class="navbar navbar-expand-md navbar-dark pg-navbar" aria-label="Menú del Colaborador">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'panel:mi_panel' %}">
      <i class="bi bi-shield-check" aria-hidden="true"></i> PhishGuard
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuColaborador" aria-controls="menuColaborador" aria-expanded="false" aria-label="Mostrar menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuColaborador">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link {% if nombre == 'mi_panel' %}active{% endif %}" href="{% url 'panel:mi_panel' %}"><i class="bi bi-house" aria-hidden="true"></i> Mi panel</a></li>
        <li class="nav-item"><a class="nav-link {% if nombre == 'reportar' %}active{% endif %}" href="{% url 'reportes:reportar' %}"><i class="bi bi-flag" aria-hidden="true"></i> Reportar correo</a></li>
      </ul>
      {% include "comun/menu_usuario.html" %}
    </div>
  </div>
</nav>
{% endwith %}
{% endblock %}
